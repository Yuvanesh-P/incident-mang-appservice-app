name: Build and Deploy FastAPI to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: incident-api-app
  PYTHON_VERSION: '3.12'
  AZURE_WEBAPP_PACKAGE_PATH: '.'

jobs:
  # ==================================================
  # BUILD AND TEST
  # ==================================================

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          pytest -v

      # Upload application artifact
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.github/
            !venv/
            !antenv/
            !.pytest_cache/
            !__pycache__/
            !ci_test.db

  # ==================================================
  # DEPLOY
  # ==================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Download build artifact
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2147859401894A3FB87EFD18D1DBB972 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5D7C09865EA14D5A98619E16A57F7C06 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D6389044D6C34F2BBDA33AC93CF6A47E }}

      # Enable Azure App Service build automation
      - name: Enable App Service build automation
        uses: azure/cli@v2
        env:
          WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        with:
          inlineScript: |
            RESOURCE_GROUP=$(az webapp show \
              --name "$WEBAPP_NAME" \
              --query resourceGroup \
              --output tsv)

            echo "Resource Group: $RESOURCE_GROUP"

            az webapp config appsettings set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEBAPP_NAME" \
              --settings SCM
